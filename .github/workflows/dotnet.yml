name: .NET Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ "published" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run tests (if test project exists)
      run: dotnet test --no-build --configuration Release --verbosity normal
      continue-on-error: true

    - name: Publish WPF Application
      run: dotnet publish -c Release -r win-x64 --self-contained false -o ./publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SypherAI-Release
        path: ./publish/
        if-no-files-found: error

    - name: Upload to Release (if triggered by release)
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./publish/SypherUI.exe
        asset_name: SypherAI_v3.0.exe
        asset_content_type: application/octet-stream
